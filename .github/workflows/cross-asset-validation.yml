name: Phase 3.5 Cross-Asset Validation (one-off)

# Runs once, triggered by adding/changing this file (paths filter), since
# there's no interactive session available to run `docker compose run`
# commands on the VPS by hand for this. Re-uses the same SSH secrets as
# deploy.yml, just for one-off backfill/backtest commands instead of
# `docker compose up`. Delete this workflow once Phase 3.5's results are
# captured in notes/cross_asset_results.md — it isn't meant to be permanent CI.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/cross-asset-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  DEPLOY_PATH: /opt/btc-trade-bot

jobs:
  validate:
    name: Backfill + backtest ETH/SOL on the VPS, commit results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run cross-asset backfill + backtests on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            {
              echo "# Phase 3.5 cross-asset validation (automated $(date -u +%Y-%m-%dT%H:%M:%SZ))"
              echo
              echo "Fixed donchian rule set — channel_period=20, exit_channel_period=55"
              echo "(deployed config.yaml defaults, no per-asset tuning, no CLI overrides)."
              echo

              for SYMBOL in ETH/USDT SOL/USDT; do
                echo "## $SYMBOL"
                echo
                echo "### Backfill"
                echo '```'
                docker compose run --rm trade-bot python main.py backfill --symbol "$SYMBOL" --timeframe 1d --start 2020-01-01T00:00:00Z
                echo '```'
                echo
                echo "### Train (2020-01-01 to 2023-12-31)"
                echo '```'
                docker compose run --rm trade-bot python main.py backtest --strategy donchian --symbol "$SYMBOL" --timeframe 1d --start 2020-01-01T00:00:00Z --end 2023-12-31T00:00:00Z
                echo '```'
                echo
                echo "### Test (2024-01-01 onward)"
                echo '```'
                docker compose run --rm trade-bot python main.py backtest --strategy donchian --symbol "$SYMBOL" --timeframe 1d --start 2024-01-01T00:00:00Z
                echo '```'
                echo
              done
            } > /tmp/cross_asset_results.md

            cat /tmp/cross_asset_results.md

      - name: Fetch results file from VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/cross_asset_key
          chmod 600 ~/.ssh/cross_asset_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          mkdir -p notes
          scp -i ~/.ssh/cross_asset_key -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST:/tmp/cross_asset_results.md" notes/cross_asset_results.md

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notes/cross_asset_results.md
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "Phase 3.5: cross-asset validation results (automated)"
          git push
