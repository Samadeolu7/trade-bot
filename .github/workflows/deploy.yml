name: Build & Deploy BTC Trade Bot

on:
  push:
    branches: [master]
  workflow_dispatch:

# two deploys at once race to replace the same containers on the server;
# a second push waits for the running deploy instead
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/btc-trade-bot
  PLATFORM_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/trade-desk-platform
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/trade-desk-frontend
  DEPLOY_PATH: /opt/btc-trade-bot

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r backend/requirements.txt

      - name: Strategy library tests
        run: python -m pytest tests -q

      - name: Platform tests
        working-directory: backend
        run: python -m pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # the frontend's API types are generated from the backend; a change to
      # one without regenerating the other fails here, not in production
      - name: API types are up to date
        working-directory: frontend
        env:
          DJANGO_DEBUG: "1"
        run: |
          (cd ../backend && python manage.py export_openapi) > openapi.json
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code -- openapi.json src/api/schema.d.ts

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

  build:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      - name: Build and push platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.platform
          push: true
          tags: |
            ${{ env.PLATFORM_IMAGE }}:latest
            ${{ env.PLATFORM_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.PLATFORM_IMAGE }}:latest
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:latest
          cache-to: type=inline

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Ensure target directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "${{ env.DEPLOY_PATH }}/"

      - name: Pull images and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            # the platform can't start without these; fail loudly rather
            # than deploy a half-configured stack
            for key in DJANGO_SECRET_KEY POSTGRES_PASSWORD; do
              if ! grep -q "^${key}=." .env 2>/dev/null; then
                echo "ERROR: ${key} is missing from ${{ env.DEPLOY_PATH }}/.env"
                exit 1
              fi
            done

            echo "==> Pulling latest images..."
            docker compose pull

            echo "==> Restarting (migrations run first)..."
            docker compose up -d --remove-orphans

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Deployment complete:"
            docker compose ps
