# One-off: bring the shadow runs into the web platform. Copies their history
# (import_sqlite) and recreates them as paper bots that continue from their
# current positions (seed_shadow_bots). Safe to re-run. Delete this workflow
# once it has run.
name: Seed platform from shadow runs

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Your username in the app (the bots are created by this user)"
        required: true

env:
  DEPLOY_PATH: /opt/btc-trade-bot

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          OWNER: ${{ inputs.owner }}
        run: '[[ "$OWNER" =~ ^[A-Za-z0-9@.+_-]+$ ]] || { echo "bad username"; exit 1; }'

      - name: Import history and seed bots
        uses: appleboy/ssh-action@v1.0.3
        env:
          OWNER: ${{ inputs.owner }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: OWNER
          command_timeout: 15m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "==> Snapshotting the shadow runs' database (consistent copy of a live file)"
            docker compose exec -T trade-bot python -c "import sqlite3; s = sqlite3.connect('data/trades.db'); d = sqlite3.connect('/tmp/shadow-snapshot.db'); s.backup(d); d.close()"
            docker compose cp trade-bot:/tmp/shadow-snapshot.db /tmp/shadow-snapshot.db
            docker compose exec -T trade-bot rm -f /tmp/shadow-snapshot.db
            docker compose cp /tmp/shadow-snapshot.db platform-web:/tmp/shadow-snapshot.db
            docker compose exec -T -u root platform-web chown appuser /tmp/shadow-snapshot.db
            rm -f /tmp/shadow-snapshot.db

            echo "==> Importing history (candles, funding, experiments, stages, shadow trades)"
            docker compose exec -T platform-web python manage.py import_sqlite /tmp/shadow-snapshot.db

            echo "==> Recreating the shadow runs as paper bots"
            docker compose exec -T platform-web python manage.py seed_shadow_bots /tmp/shadow-snapshot.db --owner "$OWNER"

            docker compose exec -T platform-web rm -f /tmp/shadow-snapshot.db
            echo "==> Done"
