name: Verify Concurrent Shadow Runs

on:
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/btc-trade-bot

jobs:
  verify:
    name: Check concurrent shadow-run containers
    runs-on: ubuntu-latest
    steps:
      - name: Inspect containers and recent logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "=== docker compose ps ==="
            docker compose ps

            echo ""
            echo "=== trade-bot (control) last 15 log lines ==="
            docker compose logs --tail 15 trade-bot

            echo ""
            echo "=== trade-bot-multi-timeframe last 15 log lines ==="
            docker compose logs --tail 15 trade-bot-multi-timeframe

            echo ""
            echo "=== trade-bot-natr-regime last 15 log lines ==="
            docker compose logs --tail 15 trade-bot-natr-regime

            echo ""
            echo "=== distinct strategy_label rows across all shadow tables ==="
            docker compose exec -T trade-bot python -c "
import sqlite3
conn = sqlite3.connect('/app/data/trades.db')
for table in ('signals', 'paper_position', 'paper_trades'):
    rows = conn.execute(f'SELECT DISTINCT strategy_label FROM {table}').fetchall()
    print(table, '->', [r[0] for r in rows])
"
