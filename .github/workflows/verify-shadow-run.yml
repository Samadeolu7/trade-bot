name: Verify Shadow Run Health (one-off)

# Same pattern as the earlier cross-asset-validation workflow: I have no
# direct shell/log access to the VPS, so this SSHes over using the existing
# deploy secrets, captures `docker compose ps` + recent logs, and commits
# them back to notes/shadow_run_health.md so they're readable without shell
# access. Delete once the health check is read — not meant as permanent CI.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/verify-shadow-run.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  DEPLOY_PATH: /opt/btc-trade-bot

jobs:
  verify:
    name: Capture shadow-run status + logs from the VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clear stale heartbeat/summary state, then capture status + logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            {
              echo "# Shadow run health check (automated $(date -u +%Y-%m-%dT%H:%M:%SZ))"
              echo
              echo "## Clearing stale bot_state markers (last_heartbeat_at, last_summary_date)"
              echo '```'
              docker compose exec -T trade-bot python -c "import sqlite3; conn = sqlite3.connect('data/trades.db'); conn.execute('DELETE FROM bot_state WHERE key IN (?, ?)', ('last_heartbeat_at', 'last_summary_date')); conn.commit(); print('remaining bot_state rows:', conn.execute('SELECT key, value FROM bot_state').fetchall())"
              echo '```'
              echo
              echo "## .env keys present (values redacted)"
              echo '```'
              sed -E 's/=.*/=<redacted>/' .env 2>/dev/null || echo "(no .env file)"
              echo '```'
              echo
              echo "## docker compose ps"
              echo '```'
              docker compose ps
              echo '```'
              echo
              echo "## Last 200 log lines (trade-bot)"
              echo '```'
              docker compose logs --tail=200 trade-bot
              echo '```'
            } > /tmp/shadow_run_health.md

            cat /tmp/shadow_run_health.md

      - name: Fetch results file from VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/verify_key
          chmod 600 ~/.ssh/verify_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          mkdir -p notes
          scp -i ~/.ssh/verify_key -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST:/tmp/shadow_run_health.md" notes/shadow_run_health.md

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notes/shadow_run_health.md
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "Verify shadow run health (automated)"
          git push
