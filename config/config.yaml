exchange:
  id: binance
  symbol: "BTC/USDT"

backfill:
  start_date: "2020-01-01T00:00:00Z"

poll:
  timeframe: "1h"
  interval_seconds: 60

storage:
  db_path: "data/trades.db"

logging:
  level: "INFO"
  file: "logs/bot.log"
  max_bytes: 5000000
  backup_count: 5

strategy:
  regime:
    adx_period: 14
    adx_threshold: 25
  ema_cross:
    fast_period: 20
    slow_period: 50
    atr_period: 14
    atr_mult: 2.0
  rsi_bb:
    rsi_period: 14
    bb_period: 20
    bb_std: 2.0
    rsi_oversold: 30
    rsi_overbought: 70

backtest:
  fee: 0.001          # Quidax order-book taker fee
  slippage: 0.0005
  initial_capital: 10000.0
  risk_pct: 0.01      # fraction of equity risked per trade, sized off stop distance
