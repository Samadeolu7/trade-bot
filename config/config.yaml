exchange:
  id: binance
  symbol: "BTC/USDT"

backfill:
  start_date: "2020-01-01T00:00:00Z"

poll:
  timeframe: "1d"          # matches the timeframe donchian was actually validated on (spec Section 8) — 1h/4h overtrade badly
  interval_seconds: 300    # daily candles don't need minute-level polling; frequent enough to catch a new one promptly

storage:
  db_path: "data/trades.db"

logging:
  level: "INFO"
  file: "logs/bot.log"
  max_bytes: 5000000
  backup_count: 5

strategy:
  regime:
    type: adx    # adx | sma200 | natr — an independent backtest found sma200 the stronger primary switch (see spec Section 6); natr is an untested candidate (Section 8)
    adx_period: 14
    adx_threshold: 25
  regime_sma:
    sma_period: 200
    band_pct: 0.0     # min distance from SMA(200), as a fraction, to count as "extended" rather than hugging the average
    adx_period: 14
    adx_threshold: 20  # looser than regime.adx_threshold — this is secondary confirmation, not the primary call
  regime_natr:
    atr_period: 14
    lookback: 100       # rolling window NATR is compared against — self-relative, not a fixed universal threshold
    percentile: 0.5     # "trending" when NATR >= its own trailing-lookback median; raise for a stricter volatility-expansion bar
  regime_switched:
    trend_strategy: donchian  # ema_cross | donchian | market_structure — donchian is the only one with a validated (if still unconfirmed) edge so far; market_structure is untested
    ranging_strategy: flat    # flat | rsi_bb — flat is the default per spec Section 8 pilot findings; rsi_bb remains opt-in
  ema_cross:
    fast_period: 20
    slow_period: 50
    atr_period: 14
    atr_mult: 2.0
  rsi_bb:
    rsi_period: 14
    bb_period: 20
    bb_std: 2.0
    rsi_oversold: 30
    rsi_overbought: 70
    stop_band_mult: 1.0  # stop distance as a multiple of band-width, independent of the bb_mid target
  donchian:
    channel_period: 20
    exit_method: channel  # channel | atr
    exit_channel_period: 55  # channel exit only; longer than entry so normal pullbacks don't chop the position out mid-trend — a free parameter, not a settled value, sweep it
    atr_period: 14        # atr exit only
    atr_mult: 2.0         # atr exit only
  market_structure:
    swing_window: 5          # bars on each side to confirm a fractal swing high/low
    retest_window: 10        # max bars after a breakout to accept a retest of the broken level
    retest_tolerance_pct: 0.01  # how close price must come back to the level to count as a retest
    atr_period: 14           # trailing-stop ATR, same mechanism as ema_cross/donchian
    atr_mult: 2.0
  vol_expansion:
    bb_period: 20
    bb_std: 2.0
    squeeze_lookback: 100     # self-relative, like regime_natr — no fixed universal "tight" threshold
    squeeze_percentile: 0.2   # width at/below this percentile of its own trailing history counts as squeezed
    atr_period: 14            # trailing-stop ATR, same mechanism as the other trend strategies
    atr_mult: 2.0
  funding_filtered:
    base_strategy: donchian   # any TREND_STRATEGY_CHOICES entry — the strategy being filtered
    high_threshold: 0.0005    # veto new longs when funding rate exceeds this (crowded-long risk) — untested guess, sweep it
    low_threshold: -0.0005    # veto new shorts when funding rate is below this (crowded-short risk)

# Perpetual funding-rate history (spec Section 7d) for funding_filtered —
# read-only, futures-only data (Binance spot has no funding), unrelated to
# the OHLCV candles used everywhere else. Quidax execution never sees this.
funding:
  exchange_id: binanceusdm
  symbol: "BTC/USDT:USDT"   # ccxt unified perpetual symbol

backtest:
  fee: 0.001          # Quidax order-book taker fee
  slippage: 0.0005
  initial_capital: 10000.0
  risk_pct: 0.01      # fraction of equity risked per trade, sized off stop distance

validation:
  # Reserved out-of-sample window — `sweep` always excludes it (no override),
  # `backtest` excludes it unless --allow-holdout is passed, which logs the
  # check to notes/holdout_validations.md. Meant for one deliberate final
  # confirmatory run per candidate strategy, not routine tuning. Note that
  # data through ~2026-09 has already been informally explored (the
  # donchian exit-channel sweep touched 2023+ with no end date) before this
  # guard existed — this date is where the discipline starts being enforced
  # going forward, not a claim that everything before it is untouched.
  holdout_start: "2026-03-01T00:00:00Z"

alerting:
  heartbeat_interval_seconds: 86400  # Phase 4 (spec Section 9) — once/day is enough to confirm the process is alive

# Advisory recommendation feed for manual trading (MT5/Exness BTCUSD) —
# separate from the automated `shadow` paper-trading simulations above.
# Never places an order anywhere; alerts are for the user's own review.
# `fee`/`slippage` approximate Exness CFD costs (not Quidax's spot fee) and
# are untested placeholders — tune to your actual account/spread.
recommend:
  fee: 0.0
  slippage: 0.0003
  # timeframe/interval_seconds default to poll.* above if omitted here.
  # Each entry mirrors one of the concurrent shadow-run configs in
  # docker-compose.yml; add more (any STRATEGY_CHOICES value, e.g. ema_cross,
  # market_structure) as new candidates without touching any code.
  strategies:
    - label: donchian_adx_control
      strategy: regime_switched
    - label: donchian_natr_regime
      strategy: regime_switched
      regime_type: natr
    - label: multi_timeframe
      strategy: multi_timeframe
    - label: vol_expansion
      strategy: vol_expansion
    - label: donchian_funding_filtered
      strategy: funding_filtered
