exchange:
  id: binance
  symbol: "BTC/USDT"

backfill:
  start_date: "2020-01-01T00:00:00Z"

poll:
  timeframe: "1d"          # matches the timeframe donchian was actually validated on (spec Section 8) — 1h/4h overtrade badly
  interval_seconds: 300    # daily candles don't need minute-level polling; frequent enough to catch a new one promptly

storage:
  db_path: "data/trades.db"

logging:
  level: "INFO"
  file: "logs/bot.log"
  max_bytes: 5000000
  backup_count: 5

strategy:
  regime:
    type: adx    # adx | sma200 — an independent backtest found sma200 the stronger primary switch (see spec Section 6)
    adx_period: 14
    adx_threshold: 25
  regime_sma:
    sma_period: 200
    band_pct: 0.0     # min distance from SMA(200), as a fraction, to count as "extended" rather than hugging the average
    adx_period: 14
    adx_threshold: 20  # looser than regime.adx_threshold — this is secondary confirmation, not the primary call
  regime_switched:
    trend_strategy: donchian  # ema_cross | donchian — donchian is the only one with a validated (if still unconfirmed) edge so far
    ranging_strategy: flat    # flat | rsi_bb — flat is the default per spec Section 8 pilot findings; rsi_bb remains opt-in
  ema_cross:
    fast_period: 20
    slow_period: 50
    atr_period: 14
    atr_mult: 2.0
  rsi_bb:
    rsi_period: 14
    bb_period: 20
    bb_std: 2.0
    rsi_oversold: 30
    rsi_overbought: 70
    stop_band_mult: 1.0  # stop distance as a multiple of band-width, independent of the bb_mid target
  donchian:
    channel_period: 20
    exit_method: channel  # channel | atr
    exit_channel_period: 55  # channel exit only; longer than entry so normal pullbacks don't chop the position out mid-trend — a free parameter, not a settled value, sweep it
    atr_period: 14        # atr exit only
    atr_mult: 2.0         # atr exit only

backtest:
  fee: 0.001          # Quidax order-book taker fee
  slippage: 0.0005
  initial_capital: 10000.0
  risk_pct: 0.01      # fraction of equity risked per trade, sized off stop distance

validation:
  # Reserved out-of-sample window — `sweep` always excludes it (no override),
  # `backtest` excludes it unless --allow-holdout is passed, which logs the
  # check to notes/holdout_validations.md. Meant for one deliberate final
  # confirmatory run per candidate strategy, not routine tuning. Note that
  # data through ~2026-09 has already been informally explored (the
  # donchian exit-channel sweep touched 2023+ with no end date) before this
  # guard existed — this date is where the discipline starts being enforced
  # going forward, not a claim that everything before it is untouched.
  holdout_start: "2026-03-01T00:00:00Z"

alerting:
  heartbeat_interval_seconds: 86400  # Phase 4 (spec Section 9) — once/day is enough to confirm the process is alive
