name: btc_trade_bot

services:
  # Control — untouched. Donchian trend / flat ranging / ADX regime filter,
  # the strategy that's been shadow-running since Phase 4. Do not change
  # this service when adding new concurrent candidates below.
  trade-bot:
    image: ${DOCKER_IMAGE:-samadeolu7/btc-trade-bot:latest}
    container_name: btc_trade_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - trade_bot_data:/app/data
      - trade_bot_logs:/app/logs
    command: ["python", "main.py", "shadow", "--strategy", "regime_switched", "--strategy-label", "donchian_adx_control"]

  # Concurrent candidate #2 (roadmap Tier 1): multi-timeframe trend +
  # pullback. Shares the candle data in trade_bot_data (same exchange/
  # symbol/timeframe) but keeps fully independent paper-trading state via
  # its own --strategy-label — no shared capital with the control.
  trade-bot-multi-timeframe:
    image: ${DOCKER_IMAGE:-samadeolu7/btc-trade-bot:latest}
    container_name: btc_trade_bot_multi_timeframe
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - trade_bot_data:/app/data
      - trade_bot_logs:/app/logs
    command: ["python", "main.py", "shadow", "--strategy", "multi_timeframe", "--strategy-label", "multi_timeframe"]

  # Concurrent candidate #3: donchian trend gated by the NATR
  # volatility-expansion regime filter instead of ADX.
  trade-bot-natr-regime:
    image: ${DOCKER_IMAGE:-samadeolu7/btc-trade-bot:latest}
    container_name: btc_trade_bot_natr_regime
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - trade_bot_data:/app/data
      - trade_bot_logs:/app/logs
    command: ["python", "main.py", "shadow", "--strategy", "regime_switched", "--strategy-label", "donchian_natr_regime", "--regime-type", "natr"]

  # Concurrent candidate #4: volatility-expansion breakout, standalone (not
  # behind a regime filter) — a distinct entry hypothesis from donchian's
  # plain price-channel breakout, see bot/strategy/vol_expansion.py.
  trade-bot-vol-expansion:
    image: ${DOCKER_IMAGE:-samadeolu7/btc-trade-bot:latest}
    container_name: btc_trade_bot_vol_expansion
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - trade_bot_data:/app/data
      - trade_bot_logs:/app/logs
    command: ["python", "main.py", "shadow", "--strategy", "vol_expansion", "--strategy-label", "vol_expansion"]

  # Concurrent candidate #5: donchian trend, filtered by Binance perpetual
  # funding-rate extremes (crowded-long/short veto) — see
  # bot/strategy/funding_filter.py. Needs read-only egress to Binance's
  # USD-M futures API in addition to spot, for funding-rate history only.
  trade-bot-funding-filtered:
    image: ${DOCKER_IMAGE:-samadeolu7/btc-trade-bot:latest}
    container_name: btc_trade_bot_funding_filtered
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - trade_bot_data:/app/data
      - trade_bot_logs:/app/logs
    command: ["python", "main.py", "shadow", "--strategy", "funding_filtered", "--strategy-label", "donchian_funding_filtered"]

volumes:
  trade_bot_data:
  trade_bot_logs:
